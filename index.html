<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Smart Stock Card PWA สำหรับเปิดระบบ Stock Card คลังยาจาก Google Apps Script">
  <title>Smart Stock Card</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="workspace">
    <iframe id="gas-frame" title="Smart Stock GAS Web App" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
  </main>

  <div id="status-pill" class="status-pill">กำลังเปิดระบบ...</div>

  <div class="floating-tools" aria-label="เครื่องมือ PWA">
    <button id="install-btn" class="tool-button hidden" type="button" title="ติดตั้งแอป" aria-label="ติดตั้งแอป">⬇</button>
    <button id="reload-btn" class="tool-button" type="button" title="รีโหลด" aria-label="รีโหลด">↻</button>
    <button id="open-direct-btn" class="tool-button" type="button" title="เปิด GAS โดยตรง" aria-label="เปิด GAS โดยตรง">↗</button>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
