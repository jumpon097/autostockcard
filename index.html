<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Smart Stock Card PWA สำหรับเปิดระบบ Stock Card คลังยาจาก Google Apps Script">
  <title>Smart Stock Card</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">▦</div>
      <div>
        <h1 id="app-title">Smart Stock Card</h1>
        <p>ระบบใบคุมคลังยา · PWA</p>
      </div>
    </div>
    <div class="actions">
      <button id="install-btn" class="button primary hidden" type="button">ติดตั้งแอป</button>
      <button id="reload-btn" class="button" type="button">รีโหลด</button>
      <button id="open-direct-btn" class="button" type="button">เปิด GAS โดยตรง</button>
    </div>
  </header>

  <div id="statusbar" class="statusbar">กำลังเปิด Smart Stock...</div>

  <main class="workspace">
    <iframe id="gas-frame" title="Smart Stock GAS Web App" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
