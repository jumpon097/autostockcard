<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="PWA Launcher สำหรับระบบ Smart Stock Card บน Google Apps Script">
  <title>Smart Stock Card</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">▦</div>
      <div>
        <h1 id="app-title">Smart Stock Card</h1>
        <p>Installable PWA Wrapper for GAS</p>
      </div>
    </div>
    <div class="actions">
      <button id="install-btn" class="button primary hidden" type="button">ติดตั้งแอป</button>
      <button id="reload-btn" class="button" type="button">รีโหลด</button>
      <button id="open-direct-btn" class="button" type="button">เปิด GAS โดยตรง</button>
      <button id="settings-btn" class="button" type="button">ตั้งค่า URL</button>
    </div>
  </header>

  <div id="statusbar" class="statusbar">กำลังเตรียมระบบ...</div>

  <main class="workspace">
    <section id="empty-state" class="empty-state hidden">
      <div class="empty-card">
        <h2>ตั้งค่า GAS Web App URL ก่อนใช้งาน</h2>
        <p>วาง URL ที่ลงท้ายด้วย <code>/exec</code> จาก Apps Script deployment แล้วกดบันทึก</p>
        <button id="empty-settings-btn" class="button primary" type="button">เปิดหน้าตั้งค่า</button>
      </div>
    </section>
    <iframe id="gas-frame" title="Smart Stock GAS Web App" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" class="dialog-card" id="settings-form">
      <h2>ตั้งค่า GAS Web App URL</h2>
      <p>ใช้ URL ของ deployment ที่ลงท้ายด้วย <code>/exec</code></p>
      <label for="gas-url">GAS Web App URL</label>
      <input id="gas-url" name="gas-url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec" required>
      <div class="dialog-actions">
        <button class="button" value="cancel" type="button" id="cancel-settings-btn">ยกเลิก</button>
        <button class="button danger" type="button" id="clear-url-btn">ล้าง URL</button>
        <button class="button primary" type="submit">บันทึกและเปิดระบบ</button>
      </div>
    </form>
  </dialog>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
